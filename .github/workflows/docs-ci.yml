name: Wiki — validação da documentação

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Instalar Zensical
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - name: Compilar site em modo estrito
        run: zensical build --clean --strict
